name: COIN.LIVE Market Snapshot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "coin-live/snapshot.py"
      - "coin-live/signals.py"
      - ".github/workflows/coin-live-market.yml"
permissions:
  contents: write
concurrency:
  group: coin-live-market
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve verified public futures quotes
        run: python3 coin-live/snapshot.py
      - name: Calculate ranked multi-timeframe signals
        run: python3 coin-live/signals.py
      - name: Publish updated snapshot and signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coin-live/market-snapshot.json coin-live/signals-snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh COIN.LIVE market snapshot [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
